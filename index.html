<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#0757b8">

<title>Vall Sena Artes Personalizadas</title>

<!-- FONTES -->
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>

<link href="https://googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  --azul:#0757b8;
  --azul-escuro:#06366f;
  --azul-claro:#eaf5ff;
  --dourado:#d9a928;
  --dourado-claro:#f5d879;
  --branco:#ffffff;
  --texto:#18324d;
  --cinza:#6d7b89;
  --fundo:#f7fbff;
  --borda:#dce8f3;
  --verde:#168447;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--fundo);
  color:var(--texto);
  font-family:'Poppins',sans-serif;
}

button,
input,
textarea,
select{
  font-family:'Poppins',sans-serif;
}

button{
  cursor:pointer;
}

/* =========================
   CABEÇALHO
========================= */

header{
  background:linear-gradient(135deg,#04346d,#0757b8,#1283e8);
  color:white;
  padding:25px 18px 30px;
  position:relative;
  overflow:hidden;
}

header:after{
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  border:2px solid rgba(255,215,120,.35);
  border-radius:50%;
  right:-100px;
  top:-130px;
}

.topo{
  max-width:1000px;
  margin:auto;
  position:relative;
  z-index:2;
}

.logo{
  text-align:center;
}

.logo-simbolo{
  width:72px;
  height:72px;
  border:2px solid var(--dourado-claro);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 8px;
  font-family:'Great Vibes',cursive;
  font-size:42px;
  color:white;
  box-shadow:0 0 0 5px rgba(255,255,255,.08);
}

.logo h1{
  margin:0;
  font-family:'Great Vibes',cursive;
  font-size:55px;
  font-weight:400;
  color:white;
  line-height:1;
}

.logo p{
  margin:7px 0 0;
  letter-spacing:2px;
  font-size:12px;
  font-weight:600;
  color:#fff;
}

.frase-logo{
  margin-top:12px;
  font-family:'Playfair Display',serif;
  font-size:15px;
  color:#ffe8a2;
}

/* =========================
   MENU
========================= */

.menu{
  max-width:1000px;
  margin:15px auto 0;
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

.menu button{
  background:rgba(255,255,255,.12);
  color:white;
  border:1px solid rgba(255,255,255,.25);
  padding:9px 14px;
  border-radius:30px;
  font-size:12px;
  font-weight:600;
}

/* =========================
   CONTAINER
========================= */

.app{
  max-width:1000px;
  margin:auto;
  padding:18px;
}

/* =========================
   HERO
========================= */

.hero{
  background:linear-gradient(135deg,#edf7ff,#ffffff);
  border:1px solid #d8e9f8;
  border-radius:25px;
  padding:28px 22px;
  margin:5px 0 30px;
  box-shadow:0 10px 30px rgba(4,65,125,.08);
  text-align:center;
  position:relative;
  overflow:hidden;
}

.hero:before{
  content:"✦";
  position:absolute;
  color:var(--dourado);
  font-size:80px;
  left:-15px;
  top:-35px;
  opacity:.18;
}

.hero h2{
  font-family:'Playfair Display',serif;
  font-size:30px;
  margin:0 0 8px;
  color:var(--azul-escuro);
}

.hero h2 span{
  color:var(--dourado);
}

.hero p{
  color:#526579;
  margin:0 auto 20px;
  max-width:600px;
}

.busca{
  width:100%;
  max-width:650px;
  margin:auto;
  display:flex;
  background:white;
  border:1px solid #d7e4ef;
  border-radius:15px;
  overflow:hidden;
}

.busca span{
  padding:14px 0 14px 16px;
  font-size:18px;
}

.busca input{
  flex:1;
  border:0;
  outline:0;
  padding:14px;
  font-size:15px;
}

.btn-principal{
  border:0;
  background:linear-gradient(135deg,var(--dourado),#f0c64c);
  color:#18324d;
  font-weight:800;
  padding:14px 25px;
  border-radius:12px;
  margin-top:16px;
  box-shadow:0 7px 18px rgba(190,145,30,.25);
}

/* =========================
   TITULOS
========================= */

.titulo{
  font-family:'Playfair Display',serif;
  font-size:29px;
  color:var(--azul-escuro);
  margin:28px 0 16px;
}

.subtitulo{
  color:var(--cinza);
  margin-top:-8px;
  margin-bottom:18px;
}

/* =========================
   CATEGORIAS
========================= */

.categorias{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.categoria{
  background:white;
  border:1px solid var(--borda);
  border-radius:18px;
  padding:17px 8px;
  text-align:center;
  transition:.2s;
}

.categoria:hover{
  transform:translateY(-3px);
  border-color:var(--dourado);
}

.categoria .icone{
  font-size:29px;
}

.categoria strong{
  display:block;
  margin-top:6px;
  font-size:13px;
}

/* =========================
   PRODUTOS
========================= */

.produtos{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.produto{
  background:white;
  border:1px solid var(--borda);
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 7px 22px rgba(11,64,110,.06);
  transition:.2s;
}

.produto:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 30px rgba(11,64,110,.12);
}

.produto-imagem{
  height:190px;
  background:linear-gradient(135deg,#dcefff,#fff6d9);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.produto-imagem:before{
  content:"VALL SENA";
  font-family:'Great Vibes',cursive;
  font-size:27px;
  color:var(--azul);
  opacity:.13;
  position:absolute;
  transform:rotate(-12deg);
}

.produto-icone{
  font-size:64px;
  position:relative;
  z-index:2;
}

.produto-conteudo{
  padding:17px;
}

.produto-categoria{
  color:var(--azul);
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.6px;
}

.produto h3{
  font-family:'Playfair Display',serif;
  font-size:21px;
  margin:5px 0;
  color:var(--azul-escuro);
}

.produto p{
  font-size:12px;
  color:#68798a;
  min-height:36px;
  margin:6px 0;
}

.preco{
  color:var(--azul);
  font-family:'Montserrat',sans-serif;
  font-size:20px;
  font-weight:800;
  margin:12px 0;
}

.btn{
  width:100%;
  border:0;
  background:var(--azul);
  color:white;
  padding:12px;
  border-radius:11px;
  font-weight:700;
  font-size:13px;
}

.btn:hover{
  background:var(--azul-escuro);
}

.btn-dourado{
  background:linear-gradient(135deg,var(--dourado),#f1ca59);
  color:#16304c;
}

/* =========================
   PERSONALIZAÇÃO
========================= */

.painel{
  display:none;
  background:white;
  border:1px solid var(--borda);
  border-radius:22px;
  padding:22px;
  margin-top:25px;
  box-shadow:0 8px 30px rgba(0,50,100,.08);
}

.painel.ativo{
  display:block;
}

.painel h2{
  font-family:'Playfair Display',serif;
  color:var(--azul-escuro);
}

.campo{
  margin-bottom:15px;
}

.campo label{
  display:block;
  font-weight:600;
  font-size:13px;
  margin-bottom:6px;
}

.campo input,
.campo textarea,
.campo select{
  width:100%;
  padding:13px;
  border:1px solid #d7e4ef;
  border-radius:11px;
  outline:0;
  background:#fbfdff;
}

.campo textarea{
  min-height:90px;
  resize:vertical;
}

/* =========================
   CARRINHO
========================= */

.carrinho{
  background:white;
  border:1px solid var(--borda);
  border-radius:22px;
  padding:20px;
  margin-top:25px;
}

.item-carrinho{
  border-bottom:1px solid #e8eef4;
  padding:12px 0;
}

.item-carrinho:last-child{
  border-bottom:0;
}

.total{
  display:flex;
  justify-content:space-between;
  font-family:'Montserrat',sans-serif;
  font-weight:800;
  font-size:20px;
  color:var(--azul-escuro);
  margin-top:18px;
}

/* =========================
   RODAPÉ
========================= */

footer{
  margin-top:45px;
  background:linear-gradient(135deg,#052e60,#0757b8);
  color:white;
  padding:30px 18px;
  text-align:center;
}

.footer-logo{
  font-family:'Great Vibes',cursive;
  font-size:40px;
  color:#fff;
}

.footer-dourado{
  color:#f5d879;
}

footer p{
  font-size:12px;
  opacity:.9;
}

.linha-dourada{
  width:100px;
  height:2px;
  background:#f0c64c;
  margin:12px auto;
}

/* =========================
   RESPONSIVIDADE (MEDIA QUERIES)
========================= */
@media (max-width: 768px) {
  .categorias {
    grid-template-columns: repeat(2, 1fr);
  }
  .produtos {
    grid-template-columns: 1fr;
  }
  .hero h2 {
    font-size: 24px;
  }
}
</style>
</head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="topo">
      <div class="logo">
        <div class="logo-simbolo">VS</div>
        <h1>Vall Sena</h1>
        <p>ARTES PERSONALIZADAS</p>
        <div class="frase-logo">Exclusividade em cada detalhe</div>
      </div>
    </div>
    
    <!-- MENU -->
    <nav class="menu">
      <button onclick="filtrar('todos')">Todos</button>
      <button onclick="filtrar('canecas')">Canecas</button>
      <button onclick="filtrar('almofadas')">Almofadas</button>
      <button onclick="filtrar('quadros')">Quadros</button>
      <button onclick="filtrar('linhas')">Linha Luxo</button>
    </nav>
  </header>

  <!-- CONTAINER PRINCIPAL -->
  <main class="app">
    
    <!-- HERO -->
    <section class="hero">
      <h2>Encontre o presente <span>perfeito</span></h2>
      <p>Produtos únicos criados especialmente para eternizar os seus momentos mais felizes.</p>
      <div class="busca">
        <span>🔍</span>
        <input type="text" placeholder="O que você está procurando hoje?">
      </div>
      <button class="btn-principal">Ver Catálogo Completo</button>
    </section>

    <h2 class="titulo">Categorias</h2>
    <p class="subtitulo">Navegue pelos nossos principais produtos</p>
    
    <!-- CATEGORIAS -->
    <section class="categorias">
      <div class="categoria">
        <div class="icone">☕</div>
        <strong>Canecas</strong>
      </div>
      <div class="categoria">
        <div class="icone">🛋️</div>
        <strong>Almofadas</strong>
      </div>
